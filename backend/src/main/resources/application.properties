spring.application.name=oficinaconectada
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
application.security.jwt.secret-key=${JWT_SECRET}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
application.security.jwt.expiration=86400000
spring.flyway.enabled=true
spring.flyway.locations=${MIGRATIONS_DB:classpath:db/migration}
spring.flyway.sql-migration-prefix=
spring.flyway.sql-migration-separator=_
spring.h2.console.enabled=false

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.habilitado=${EMAIL_HABILITADO:false}
app.email.remetente=${EMAIL_REMETENTE:nao-responda@oficinaconectada.local}

app.admin.email=${ADMIN_EMAIL:admin@oficina.com}
app.admin.senha-inicial=${ADMIN_SENHA_INICIAL:}
